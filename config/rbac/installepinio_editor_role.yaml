# This rule is not used by the project epinio itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the epinio.apps.epinio.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: epinio
    app.kubernetes.io/managed-by: kustomize
  name: installepinio-editor-role
rules:
- apiGroups:
  - epinio.apps.epinio.io
  resources:
  - installepinios
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - epinio.apps.epinio.io
  resources:
  - installepinios/status
  verbs:
  - get
