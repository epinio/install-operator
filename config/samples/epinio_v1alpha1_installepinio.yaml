apiVersion: epinio.apps.epinio.io/v1alpha1
kind: InstallEpinio
metadata:
  labels:
    app.kubernetes.io/name: epinio
    app.kubernetes.io/managed-by: kustomize
  name: installepinio-sample
spec:
  # Domain for Epinio (e.g. use your LoadBalancer IP or host: 192.168.1.4.nip.io)
  domain: epinio.local
  # Namespace where Epinio will be installed (default: epinio)
  targetNamespace: epinio
